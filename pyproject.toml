[project]
name = "fasthtml"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cairosvg>=2.9.0",
    "img2pdf>=0.6.1",
    "ipykernel>=7.0.1",
    "pillow>=12.0.0",
    "python-fasthtml>=0.12.30",
    "requests>=2.32.5",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.3",
]
# Browser tests. Not installed by default:
#   uv sync --group e2e && uv run playwright install chromium
#   uv run pytest -m e2e
e2e = [
    "playwright>=1.48",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers -m 'not network and not e2e'"
markers = [
    "network: hits real tile/Overpass servers; deselected by default",
    "e2e: drives a real browser via Playwright; deselected by default",
]

[tool.ruff.lint]
ignore = ["F403", "F405"]
